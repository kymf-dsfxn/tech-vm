# /etc/systemd/system/syncthing@stsync.service.d/data-disk.conf
#
# Drop-in over the packaged syncthing@.service: binds Syncthing to the
# encrypted platform data disk. Installed by guest-install.sh.
# Rationale: capability.encrypted-datadisk.md, "Consuming the data root".

[Unit]
After=srv-dsfxn.mount
BindsTo=srv-dsfxn.mount

# Both conditions skip rather than fail: an unprovisioned node is not a
# broken node.

# Disk locked -> do not start.
ConditionPathIsMountPoint=/srv/dsfxn

# No rendered config -> do not start. Syncthing started without a config
# invents a fresh identity and defaults (global discovery on), so the config
# must exist before the binary runs. The 'After=' above ensures the path is
# tested against the mounted disk. Rendered once with `sudo sync-node render`.
ConditionPathExists=/srv/dsfxn/.platform/syncthing/config.xml

[Service]
# Identity, config and index database all on the encrypted disk (STHOMEDIR
# sets both the 2.x config and data directories).
Environment="STHOMEDIR=/srv/dsfxn/.platform/syncthing"

# Write access to the 2775 dsfxn:dsfxn tree.
SupplementaryGroups=dsfxn

# Overrides upstream's UMask=7027: the folder replicates permission bits, and
# 0002 creates 0664/2775 so platform group access replicates. Rationale:
# capability.data-synchronisation.md, "Permission replication".
UMask=0002

# Inert under upstream's ProtectSystem=full; keeps /srv/dsfxn writable if the
# unit is later raised to ProtectSystem=strict.
ReadWritePaths=/srv/dsfxn

# Overrides upstream's RestrictSUIDSGID=true, a seccomp filter that returns
# EPERM for any chmod carrying S_ISGID. The share is a setgid tree by design -
# 2775 is what makes group dsfxn inherit - so Syncthing re-applies that bit on
# every directory it handles, and every such call was refused. The mkdir/chmod
# pair then never completes, the directory is never recorded as done, and it is
# retried forever: measured on xd00-lde-0030, 1806 directories stuck in
# needDirectories and 1806 pullErrors, with the correct 2775 already on disk.
# Setgid directories and this filter cannot both stand; this one yields.
#
# Most of what it stopped is unreachable anyway: no ambient CAP_CHOWN (see
# below), so Syncthing can only create files owned by stsync, and a setuid bit
# on one of those confers stsync - the uid it already runs as. Not root. The
# residual case, and it is real, is that CAP_FOWNER lets it chmod files it does
# not own, so a peer pushing 4755 for a locally kymf-owned path yields a
# setuid-kymf binary; that needs an already compromised trusted device.
# Rationale: capability.data-synchronisation.md, "Permission replication".
RestrictSUIDSGID=false

# Ownership never replicates, so each node's copy is owned by whoever wrote it:
# stsync for anything arriving over the wire, kymf for anything authored here
# (kymf:dsfxn 0664, group via setgid). chmod and utimensat need ownership or
# CAP_FOWNER, and stsync runs with an empty effective set, so a permission
# change arriving for a kymf-authored path fails and sticks exactly as above.
#
# Upstream already scopes CapabilityBoundingSet to cap_chown,cap_fowner while
# leaving AmbientCapabilities empty - the capability is anticipated but not
# granted. Grant only CAP_FOWNER. CAP_CHOWN is deliberately left out: without
# it Syncthing cannot give a file away to another uid, which is what keeps the
# clause above true.
AmbientCapabilities=CAP_FOWNER
