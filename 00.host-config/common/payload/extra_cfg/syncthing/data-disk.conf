# /etc/systemd/system/syncthing@stsync.service.d/data-disk.conf
#
# Drop-in over the packaged syncthing@.service: binds Syncthing to the
# encrypted platform data disk. Installed by guest-install.sh.
# Rationale: capability.encrypted-datadisk.md, "Consuming the data root".

[Unit]
After=srv-dsfxn.mount
BindsTo=srv-dsfxn.mount

# Both conditions skip rather than fail: an unprovisioned node is not a
# broken node.

# Disk locked -> do not start.
ConditionPathIsMountPoint=/srv/dsfxn

# No rendered config -> do not start. Syncthing started without a config
# invents a fresh identity and defaults (global discovery on), so the config
# must exist before the binary runs. The 'After=' above ensures the path is
# tested against the mounted disk. Rendered once with `sudo sync-node render`.
ConditionPathExists=/srv/dsfxn/.platform/syncthing/config.xml

[Service]
# Identity, config and index database all on the encrypted disk (STHOMEDIR
# sets both the 2.x config and data directories).
Environment="STHOMEDIR=/srv/dsfxn/.platform/syncthing"

# Write access to the 2775 dsfxn:dsfxn tree.
SupplementaryGroups=dsfxn

# Overrides upstream's UMask=7027: the folder replicates permission bits, and
# 0002 creates 0664/2775 so platform group access replicates. Rationale:
# capability.data-synchronisation.md, "Permission replication".
UMask=0002

# Inert under upstream's ProtectSystem=full; keeps /srv/dsfxn writable if the
# unit is later raised to ProtectSystem=strict.
ReadWritePaths=/srv/dsfxn
