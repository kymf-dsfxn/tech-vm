# Boot entry used when the ISO is booted as a file from another GRUB (a
# multiboot USB stick, via iso-scan). Deliberately NO autoinstall entry here:
# a loopback boot targets some arbitrary physical machine, and autoinstall
# would wipe its smallest disk unattended. Unattended install happens only via
# grub.cfg, on the ISO attached to the freshly created VM.
menuentry "Try or Install Ubuntu Server" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  iso-scan/filename=${iso_path} ---
	initrd	/casper/initrd
}
